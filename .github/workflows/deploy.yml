name: Deploy to Environment

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Deploying to: ${{ vars.SITE_TITLE }}"
          echo "Server: ${{ vars.DEPLOY_HOST }}"
          echo "Path: ${{ vars.DEPLOY_PATH }}"

      - name: Replace placeholders with environment values
        run: |
          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" index.html
          sed -i "s|__SITE_COLOR__|${{ vars.SITE_COLOR }}|g" style.css
          echo "✅ Placeholders replaced"
          head -5 index.html

      - name: Deploy to EC2 via SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

cat > ~/.ssh/deploy_key <<'EOF'
${{ secrets.SSH_PRIVATE_KEY }}
EOF

          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            index.html style.css app.js \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          echo "✅ Files deployed"

      - name: Verify deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

cat > ~/.ssh/deploy_key <<'EOF'
${{ secrets.SSH_PRIVATE_KEY }}
EOF

          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "ls -la '$DEPLOY_PATH'"

          echo "✅ Deployment verified"

